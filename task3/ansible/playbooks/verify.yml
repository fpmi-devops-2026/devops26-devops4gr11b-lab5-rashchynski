---
- name: Show cluster and application state
  hosts: localhost
  gather_facts: false

  vars:
    kubeconfig: "{{ playbook_dir }}/../../terraform/kubeconfig"
    kubectl: "kubectl --kubeconfig {{ kubeconfig }}"

  tasks:
    - name: Show nodes
      ansible.builtin.command:
        cmd: "{{ kubectl }} get nodes -o wide"
      register: nodes
      changed_when: false

    - name: Show pods
      ansible.builtin.command:
        cmd: "{{ kubectl }} -n lab5 get pods -o wide"
      register: pods
      changed_when: false

    - name: Show services
      ansible.builtin.command:
        cmd: "{{ kubectl }} -n lab5 get svc"
      register: svc
      changed_when: false

    - name: Cluster state
      ansible.builtin.debug:
        msg:
          - "{{ nodes.stdout_lines }}"
          - "{{ pods.stdout_lines }}"
          - "{{ svc.stdout_lines }}"
