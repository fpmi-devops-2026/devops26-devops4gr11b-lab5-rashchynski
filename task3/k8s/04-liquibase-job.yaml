apiVersion: batch/v1
kind: Job
metadata:
  name: liquibase
  namespace: lab5
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: liquibase
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - until pg_isready -h db -U postgres -d students_db; do sleep 2; done
      containers:
        - name: liquibase
          image: nrashchynski/lab5-liquibase:v1
          args: ["update"]
          env:
            - name: LIQUIBASE_COMMAND_URL
              value: jdbc:postgresql://db:5432/students_db
            - name: LIQUIBASE_COMMAND_USERNAME
              value: postgres
            - name: LIQUIBASE_COMMAND_PASSWORD
              value: postgres
            - name: LIQUIBASE_COMMAND_CHANGELOG_FILE
              value: changelog.xml
          volumeMounts:
            - name: changelog
              mountPath: /liquibase/changelog
      volumes:
        - name: changelog
          configMap:
            name: liquibase-changelog
